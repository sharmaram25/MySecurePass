<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Secure client-side password generator" />
    
    <title>MySecurePass</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              brand: {
                blue: '#3b82f6', // Bright Blue
                darkBlue: '#1e40af', // Deep Blue
                green: '#10b981', // Emerald
                teal: '#14b8a6', // Teal for dark mode accents
                navy: '#0f172a', // Slate 900
                darker: '#020617', // Slate 950
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Alive Background Animation - Light */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      .alive-bg {
        background: linear-gradient(-45deg, #f8fafc, #e0f2fe, #f1f5f9, #eff6ff);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }

      /* Alive Background Animation - Dark */
      html.dark body {
        background: linear-gradient(-45deg, #020617, #0f172a, #1e293b, #0f172a);
        background-size: 400% 400%;
      }

      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      /* Mobile Optimization */
      input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
        font-size: 16px;
      }
      
      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>

  }
}
</script>
